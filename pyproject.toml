[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filesift"
version = "0.1.0"
description = "Intelligent file indexing and search system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-community",
    "langchain_huggingface",
    "faiss-cpu",
    "sentence-transformers",
    "openai",
    "python-dotenv",
    "tiktoken",
    "rank-bm25",
    "click",
    "tqdm",
    "platformdirs"
]

[project.optional-dependencies]
dev = []

[project.scripts]
filesift = "filesift.cli.command:main"

[tool.setuptools.packages.find]
include = ["filesift*"]
